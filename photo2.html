<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রিমিয়াম গ্যালারি</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0d10;
      color: #eaeef2;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    /* পাসওয়ার্ড ওভারলে */
    #password-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(8, 10, 14, 0.94);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      transition: opacity 0.6s ease;
    }
    #password-overlay.hidden { opacity: 0; pointer-events: none; }
    .password-box {
      max-width: 400px;
      width: 90%;
      padding: 2.5rem 2rem;
      background: #181c22;
      border-radius: 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      text-align: center;
      border: 1px solid #2d333b;
    }
    .password-box h1 { font-weight: 600; font-size: 2rem; letter-spacing: -0.5px; margin-bottom: 0.25rem; }
    .password-box p { color: #9aa4b0; font-size: 0.95rem; margin-bottom: 2rem; }
    .password-box input {
      width: 100%;
      padding: 1rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #2f3640;
      background: #11151b;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    .password-box input:focus { border-color: #6c7a8a; background: #0f1319; }
    .password-box .error { color: #f27a7a; font-size: 0.9rem; margin: 0.75rem 0 0.25rem; min-height: 1.8rem; }
    .password-box button {
      width: 100%;
      padding: 1rem;
      margin-top: 1.2rem;
      background: #2f3a47;
      border: none;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      letter-spacing: 0.3px;
    }
    .password-box button:hover { background: #3f4c5c; }
    .lock-icon { font-size: 2.6rem; margin-bottom: 0.5rem; color: #a0b3cc; }

    /* গ্যালারি কন্টেইনার */
    .gallery-container { max-width: 1600px; margin: 0 auto; padding: 1.2rem 1.5rem 4rem; }
    .gallery-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 0 1.8rem;
      border-bottom: 1px solid #21262e;
    }
    .gallery-header h2 {
      font-weight: 600;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #eef2f6, #b6c8d9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .search-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }
    .search-filter input {
      background: #181d24;
      border: 1px solid #2c333d;
      border-radius: 40px;
      padding: 0.7rem 1.4rem;
      color: white;
      font-size: 0.9rem;
      width: 200px;
      outline: none;
      transition: 0.2s;
    }
    .search-filter input:focus { border-color: #5b6c80; background: #141a21; }
    .search-filter input::placeholder { color: #6b7a8a; }
    .filter-buttons {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid #2e3641;
      color: #b0c0cf;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: 0.15s;
      text-transform: uppercase;
    }
    .filter-btn.active {
      background: #3b4656;
      border-color: #5b6d82;
      color: white;
    }
    .filter-btn:hover { background: #2d3643; }

    /* ===== ম্যাসনরি গ্রিড ===== */
    .masonry {
      column-count: 4;
      column-gap: 16px;
      padding-top: 1.8rem;
    }
    .masonry-item {
      break-inside: avoid;
      margin-bottom: 16px;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.7);
      transition: transform 0.2s ease, box-shadow 0.2s;
      cursor: pointer;
      /* ব্যাকগ্রাউন্ড গ্রেডিয়েন্ট থাকবে JavaScript থেকে সেট করা */
      background: #1a1f26;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }
    .masonry-item:hover {
      transform: scale(1.01);
      box-shadow: 0 20px 40px rgba(0,0,0,0.9);
    }
    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      max-height: 600px;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
      /* ব্যাকগ্রাউন্ডের উপর ছবি বসবে */
      position: relative;
      z-index: 2;
      mix-blend-mode: normal;
      padding: 8px;
    }
    /* ওয়াটারমার্ক */
    .watermark {
      position: absolute;
      bottom: 10px;
      right: 14px;
      color: rgba(255,255,255,0.6);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(4px);
      padding: 4px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
      text-transform: uppercase;
      z-index: 3;
    }

    /* লোডিং স্পিনার */
    .loading-spinner {
      text-align: center;
      padding: 2rem 0;
      color: #7e8d9e;
      font-size: 0.9rem;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #2d3643;
      border-top: 3px solid #b6c8d9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* লাইটবক্স */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(16px);
      z-index: 9998;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 1.5rem;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90%;
      max-height: 80vh;
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 30px;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.7;
      transition: 0.2s;
      background: rgba(0,0,0,0.3);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lightbox-close:hover { opacity: 1; background: rgba(255,255,255,0.1); }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 2.2rem;
      opacity: 0.4;
      cursor: pointer;
      padding: 0.8rem;
      transition: 0.2s;
    }
    .lightbox-nav:hover { opacity: 1; }
    .lightbox-nav.prev { left: 20px; }
    .lightbox-nav.next { right: 20px; }
    .lightbox-share {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1.4rem;
      color: #ccc;
      font-size: 1.5rem;
    }
    .lightbox-share i { cursor: pointer; opacity: 0.5; transition: 0.2s; }
    .lightbox-share i:hover { opacity: 1; color: white; }

    /* ফুটার */
    .gallery-footer {
      text-align: center;
      padding: 3rem 0 1.5rem;
      color: #5d6d7e;
      font-size: 0.8rem;
      border-top: 1px solid #1f252e;
      margin-top: 2rem;
    }

    /* রেসপন্সিভ */
    @media (max-width: 1200px) { .masonry { column-count: 3; } }
    @media (max-width: 800px) { .masonry { column-count: 2; } }
    @media (max-width: 520px) {
      .masonry { column-count: 1; }
      .gallery-header { flex-direction: column; align-items: stretch; gap: 0.8rem; }
      .search-filter { flex-direction: column; align-items: stretch; }
      .search-filter input { width: 100%; }
      .filter-buttons { justify-content: center; }
    }
    /* প্রটেকশন */
    img { -webkit-user-drag: none; user-select: none; pointer-events: none; }
    .masonry-item { user-select: none; }
  </style>
</head>
<body>

<!-- পাসওয়ার্ড ওভারলে -->
<div id="password-overlay">
  <div class="password-box">
    <div class="lock-icon"><i class="fas fa-lock"></i></div>
    <h1>প্রাইভেট গ্যালারি</h1>
    <p>অ্যাক্সেস কী দিন</p>
    <input type="password" id="password-input" placeholder="••••••••" autofocus>
    <div class="error" id="password-error"></div>
    <button id="password-submit"><i class="fas fa-arrow-right" style="margin-right: 8px;"></i>আনলক</button>
  </div>
</div>

<!-- গ্যালারি -->
<div class="gallery-container" id="galleryApp">
  <header class="gallery-header">
    <h2>✦ প্রিমিয়াম</h2>
    <div class="search-filter">
      <input type="text" id="searchInput" placeholder="ছবি খুঁজুন...">
      <div class="filter-buttons" id="filterContainer">
        <button class="filter-btn active" data-filter="all">সব</button>
        <button class="filter-btn" data-filter="nature">প্রকৃতি</button>
        <button class="filter-btn" data-filter="city">শহর</button>
        <button class="filter-btn" data-filter="people">মানুষ</button>
        <button class="filter-btn" data-filter="tech">টেক</button>
      </div>
    </div>
  </header>

  <div class="masonry" id="masonryGrid"></div>
  <div class="loading-spinner" id="loadingIndicator"><div class="spinner"></div><p style="margin-top:8px;">আরও লোড হচ্ছে...</p></div>
  <div class="gallery-footer">© ২০২৬ প্রিমিয়াম গ্যালারি · সর্বস্বত্ব সংরক্ষিত</div>
</div>

<!-- লাইটবক্স -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightboxClose"><i class="fas fa-times"></i></span>
  <span class="lightbox-nav prev" id="lightboxPrev"><i class="fas fa-chevron-left"></i></span>
  <span class="lightbox-nav next" id="lightboxNext"><i class="fas fa-chevron-right"></i></span>
  <img id="lightboxImg" src="" alt="প্রিভিউ">
  <div class="lightbox-share">
    <i class="fab fa-twitter" id="shareTwitter"></i>
    <i class="fab fa-facebook" id="shareFacebook"></i>
    <i class="fas fa-link" id="shareLink"></i>
  </div>
</div>

<script>
  (function() {
    // ========================================
    // ১. পাসওয়ার্ড
    // ========================================
    const PASSWORD = "gallery2026";
    const overlay = document.getElementById('password-overlay');
    const passInput = document.getElementById('password-input');
    const passError = document.getElementById('password-error');
    const passSubmit = document.getElementById('password-submit');

    function checkSession() {
      if (localStorage.getItem('gallery_auth') === 'true') {
        overlay.classList.add('hidden');
        return true;
      }
      return false;
    }
    function unlock() {
      const val = passInput.value.trim();
      if (val === PASSWORD) {
        localStorage.setItem('gallery_auth', 'true');
        overlay.classList.add('hidden');
        passError.textContent = '';
        passInput.value = '';
      } else {
        passError.textContent = '⨯ ভুল পাসওয়ার্ড, আবার চেষ্টা করুন';
        passInput.value = '';
        passInput.focus();
      }
    }
    passSubmit.addEventListener('click', unlock);
    passInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
    if (!checkSession()) { overlay.classList.remove('hidden'); passInput.focus(); }
    else { overlay.classList.add('hidden'); }

    // ========================================
    // ২. কালারফুল ব্যাকগ্রাউন্ড জেনারেটর
    // ========================================
    function generateGradient() {
      const palettes = [
        ['#ff6b6b', '#feca57', '#48dbfb'],
        ['#ff9ff3', '#f368e0', '#ff6b6b'],
        ['#54a0ff', '#5f27cd', '#341f97'],
        ['#1dd1a1', '#10ac84', '#01a3a4'],
        ['#f0932b', '#eb4d4b', '#6ab04c'],
        ['#7ed6df', '#e056fd', '#f0932b'],
        ['#4834d4', '#686de0', '#30336b'],
        ['#6ab04c', '#f9ca24', '#eb4d4b'],
        ['#ff7979', '#f9ca24', '#6ab04c'],
        ['#130f40', '#535c68', '#7f8fa6'],
        ['#2ecc71', '#3498db', '#9b59b6'],
        ['#e67e22', '#e74c3c', '#2c3e50']
      ];
      const pal = palettes[Math.floor(Math.random() * palettes.length)];
      const angle = Math.floor(Math.random() * 360);
      return `linear-gradient(${angle}deg, ${pal[0]}, ${pal[1]}, ${pal[2]})`;
    }

    // ========================================
    // ৩. গ্যালারি লজিক
    // ========================================
    let allImages = [];
    let currentFilter = 'all';
    let searchTerm = '';
    let visibleImages = [];
    let currentPage = 0;
    const PAGE_SIZE = 8;
    let isLoading = false;
    let allLoaded = false;

    const grid = document.getElementById('masonryGrid');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let lightboxImages = [];
    let lightboxIndex = 0;
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeLightbox = document.getElementById('lightboxClose');
    const prevBtn = document.getElementById('lightboxPrev');
    const nextBtn = document.getElementById('lightboxNext');
    const WATERMARK = '✦ প্রিমিয়াম';

    function renderImages(images) {
      if (images.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; color:#6a7b8c;">কোনো ছবি পাওয়া যায়নি</div>`;
        return;
      }
      let html = '';
      images.forEach(img => {
        const gradient = generateGradient();
        html += `
          <div class="masonry-item" data-id="${img.id}" data-category="${img.category}" data-title="${img.title}" data-full="${img.src}" style="background: ${gradient};">
            <img src="${img.src}" alt="${img.title}" loading="lazy">
            <div class="watermark">${WATERMARK}</div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function getFiltered() {
      let filtered = allImages;
      if (currentFilter !== 'all') {
        filtered = filtered.filter(img => img.category === currentFilter);
      }
      if (searchTerm.trim() !== '') {
        const term = searchTerm.trim().toLowerCase();
        filtered = filtered.filter(img => 
          img.title.toLowerCase().includes(term) || 
          img.category.includes(term)
        );
      }
      return filtered;
    }

    function loadMore() {
      if (isLoading || allLoaded) return;
      isLoading = true;
      loadingIndicator.style.display = 'block';

      const filtered = getFiltered();
      const start = currentPage * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pageItems = filtered.slice(start, end);

      if (pageItems.length === 0) {
        allLoaded = true;
        loadingIndicator.style.display = 'none';
        isLoading = false;
        return;
      }

      visibleImages = visibleImages.concat(pageItems);
      renderImages(visibleImages);
      currentPage++;
      isLoading = false;
      loadingIndicator.style.display = 'none';

      if (end >= filtered.length) {
        allLoaded = true;
        loadingIndicator.innerHTML = '<p style="color:#4d5d6e;">— গ্যালারির শেষ —</p>';
      } else {
        loadingIndicator.innerHTML = '<div class="spinner"></div><p style="margin-top:8px;">আরও লোড হচ্ছে...</p>';
      }
    }

    function resetGallery() {
      visibleImages = [];
      currentPage = 0;
      allLoaded = false;
      loadingIndicator.innerHTML = '<div class="spinner"></div><p style="margin-top:8px;">আরও লোড হচ্ছে...</p>';
      loadingIndicator.style.display = 'block';
      grid.innerHTML = '';
      loadMore();
    }

    // JSON লোড
    fetch('images.json')
      .then(res => {
        if (!res.ok) throw new Error('JSON ফাইল পাওয়া যায়নি');
        return res.json();
      })
      .then(data => {
        allImages = data;
        resetGallery();
      })
      .catch(err => {
        console.error('JSON লোড করতে সমস্যা:', err);
        allImages = [];
        resetGallery();
      });

    // ফিল্টার ও সার্চ
    filterBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        filterBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        resetGallery();
      });
    });
    searchInput.addEventListener('input', function() {
      searchTerm = this.value;
      resetGallery();
    });

    // ইনফিনিটি স্ক্রল
    window.addEventListener('scroll', function() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
        loadMore();
      }
    });

    // ========================================
    // ৪. লাইটবক্স
    // ========================================
    function openLightbox(index) {
      if (!lightboxImages.length) return;
      lightboxIndex = index;
      lightboxImg.src = lightboxImages[index].full;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightboxFn() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    grid.addEventListener('click', function(e) {
      const item = e.target.closest('.masonry-item');
      if (!item) return;
      const id = parseInt(item.dataset.id);
      const img = allImages.find(i => i.id === id);
      if (!img) return;
      lightboxImages = visibleImages.map(i => ({ full: i.src, title: i.title }));
      const idx = lightboxImages.findIndex(i => i.full === img.src);
      if (idx !== -1) openLightbox(idx);
    });

    closeLightbox.addEventListener('click', closeLightboxFn);
    document.addEventListener('keydown', function(e) {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightboxFn();
      if (e.key === 'ArrowLeft') {
        lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
        lightboxImg.src = lightboxImages[lightboxIndex].full;
      }
      if (e.key === 'ArrowRight') {
        lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
        lightboxImg.src = lightboxImages[lightboxIndex].full;
      }
    });
    prevBtn.addEventListener('click', function() {
      lightboxIndex = (lightboxIndex - 1 + lightboxImages.length) % lightboxImages.length;
      lightboxImg.src = lightboxImages[lightboxIndex].full;
    });
    nextBtn.addEventListener('click', function() {
      lightboxIndex = (lightboxIndex + 1) % lightboxImages.length;
      lightboxImg.src = lightboxImages[lightboxIndex].full;
    });

    // সোশ্যাল শেয়ার
    document.getElementById('shareTwitter').addEventListener('click', function() {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://twitter.com/intent/tweet?url=${url}&text=চেক%20আউট%20এই%20ছবিটি!`, '_blank');
    });
    document.getElementById('shareFacebook').addEventListener('click', function() {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    });
    document.getElementById('shareLink').addEventListener('click', function() {
      navigator.clipboard?.writeText(window.location.href).then(() => alert('লিংক কপি করা হয়েছে!'));
    });

    // ========================================
    // ৫. প্রটেকশন
    // ========================================
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && (e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U' || e.key === 'i' || e.key === 'I')) {
        e.preventDefault();
      }
      if (e.key === 'F12') e.preventDefault();
    });

  })();
</script>
</body>
</html>
